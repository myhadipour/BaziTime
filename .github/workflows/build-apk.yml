name: Build Bazi Time Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd android
          gradle --no-daemon --stacktrace clean assembleDebug
          mkdir -p ../release-out
          cp app/build/outputs/apk/debug/app-debug.apk ../release-out/BaziTime-Android.apk

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" verify release-out/BaziTime-Android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaziTime-Android-APK
          path: release-out/BaziTime-Android.apk
          if-no-files-found: error
          retention-days: 30
