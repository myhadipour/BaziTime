
name: Build BaziTime APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - uses: android-actions/setup-android@v4

      - name: Inspect Android Launcher Icons
        run: |
          echo "===== Adaptive Icon XML ====="
          find app/src/main/res/mipmap-anydpi-v26 \
            -maxdepth 1 -type f -name '*.xml' \
            -print -exec cat {} \;

          echo "===== Available Launcher Icons ====="
          find app/src/main/res \
            -type f \( -name 'ic_launcher*' -o -name 'ic_launcher_round*' \) \
            -print

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BaziTime-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
